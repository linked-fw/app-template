# PR check for the app template: install from the committed lockfile, run the
# unit tests, build, and run the browser smoke test (e2e/) against a real Fuseki.
#
# Runs on PRs to main and to blank (the template without the example), on
# pushes to blank (sync-blank.yml's merges of main among them), and on demand.
#
# Not the shared linked-fw/.github pr.yml: that one runs `linked build`, which
# refuses an app (`linked.kind: "app"`, "not a linked package"). The job is still named
# `Build & Test`, the check name the other linked-fw repos require, so it is
# what Renovate's automerge of the `linked framework` group and of
# lockFileMaintenance waits on.
#
# Apps generated from this template inherit the file; the job only runs in the
# template's own repository.
name: PR

on:
  pull_request:
    branches:
      - main
      - blank
  push:
    branches:
      - blank
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    if: github.repository == 'linked-fw/app-template'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The Linked Fuseki image (datasets infer RDFS classes, /<ds>/stored),
      # which every linked app runs on and e2e/ontology.spec.ts needs.
      fuseki:
        image: ghcr.io/linked-fw/fuseki:6.2.0-2
        env:
          ADMIN_PASSWORD: admin
          ENABLE_UPDATE: 'true'
          ENABLE_DATA_WRITE: 'true'
        ports:
          - 3030:3030
        options: >-
          --health-cmd "wget -qO- http://localhost:3030/ >/dev/null 2>&1 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FUSEKI_BASE_URL: http://localhost:3030
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      # setup-node does not install the npm that `packageManager` names.
      - name: Use the npm named in packageManager
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager.replace(/^npm@/, '').split('+')[0]")
          [ "$(npm --version)" = "$want" ] || npm install --global --no-audit --no-fund "npm@$want"
          echo "npm $(npm --version)"

      # Installs exactly what a generated app installs: the committed lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Linked versions installed
        run: npm ls --depth=0 | grep '@_linked/'

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test (template and generated-project layouts)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
